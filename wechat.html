<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ee">
  <title>微信咨询 | PARK SILICON</title>
  <link rel="icon" href="original-site/favicon-96x96.png">
  <style>
    :root {
      --brand: #4f1810;
      --brand-deep: #381c19;
      --paper: #f5f2ee;
      --white: #fff;
      --ink: #25201e;
      --muted: #736c68;
      --green: #315f4c;
      --line: rgba(79, 24, 16, .16);
      --sans: "Noto Sans TC", "Noto Sans SC", "PingFang HK", "PingFang SC", "Microsoft JhengHei", "Microsoft YaHei", Arial, sans-serif;
      --serif: Georgia, "Times New Roman", "Noto Serif TC", "Noto Serif SC", serif;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--paper); }
    body {
      min-height: 100svh;
      margin: 0;
      background: var(--paper) url("original-site/sharp/f_webp/q_50/w_1920/footer_bg_png.webp") center / cover fixed;
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.65;
      letter-spacing: 0;
    }

    button, a { color: inherit; font: inherit; }
    button { cursor: pointer; }
    a { text-decoration: none; }

    .site-header {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 14px clamp(20px, 6vw, 88px);
      background: rgba(255, 255, 255, .9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .brand {
      color: var(--brand);
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 700;
    }

    .back-link {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      color: var(--brand);
      font-size: 14px;
      font-weight: 700;
      transition: transform .22s ease, color .22s ease;
    }

    .back-link span:first-child {
      font-size: 20px;
      line-height: 1;
    }

    .back-link:hover,
    .back-link:focus-visible {
      color: var(--brand-deep);
      transform: translateX(-3px);
    }

    .page-shell {
      width: min(1120px, calc(100% - 40px));
      min-height: calc(100svh - 82px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 380px);
      align-items: center;
      gap: clamp(52px, 9vw, 120px);
      margin: 0 auto;
      padding: clamp(56px, 9vh, 100px) 0;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--brand-deep);
      font-family: var(--serif);
      font-size: clamp(44px, 6vw, 76px);
      font-weight: 400;
      line-height: 1.1;
    }

    .subtitle {
      max-width: 620px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
    }

    .advisor {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 36px;
    }

    .advisor-avatar {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--white) url("assets/wechat-source.jpg") no-repeat;
      background-size: 356px auto;
      background-position: -15px -91px;
    }

    .advisor p { margin: 0; }
    .advisor-label { color: var(--muted); font-size: 12px; }
    .advisor-name { margin-top: 2px !important; font-weight: 700; }

    .wechat-number {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 20px;
      margin-top: 34px;
      padding: 24px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .field-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .wechat-id {
      display: block;
      margin-top: 2px;
      color: var(--brand-deep);
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
    }

    .button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 20px;
      border: 1px solid var(--brand);
      border-radius: 2px;
      background: transparent;
      color: var(--brand);
      font-size: 14px;
      font-weight: 700;
      transition: transform .18s ease, background-color .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-2px);
      background: var(--brand);
      color: var(--white);
      box-shadow: 0 8px 24px rgba(79, 24, 16, .18);
    }

    .button:active {
      transform: scale(.98);
      box-shadow: none;
    }

    .button-primary {
      width: 100%;
      margin-top: 26px;
      background: var(--brand);
      color: var(--white);
    }

    .button-primary:hover,
    .button-primary:focus-visible {
      background: var(--brand-deep);
    }

    .message-card {
      margin-top: 28px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 18px 45px rgba(56, 28, 25, .08);
    }

    .message-card > p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .message-text {
      margin: 16px 0 0;
      padding: 0 0 0 18px;
      border-left: 3px solid var(--green);
      color: var(--ink);
      font-size: 18px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .profile-preview {
      align-self: stretch;
      min-height: 600px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(79, 24, 16, .12);
      border-radius: 8px;
      background: #ecebea;
      box-shadow: 0 24px 60px rgba(56, 28, 25, .16);
    }

    .profile-preview img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: top center;
    }

    .profile-caption {
      position: absolute;
      right: 14px;
      bottom: 14px;
      left: 14px;
      padding: 12px 14px;
      border-radius: 4px;
      background: rgba(56, 28, 25, .88);
      color: var(--white);
      font-size: 12px;
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 20;
      right: 20px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 20px;
      width: fit-content;
      max-width: calc(100% - 40px);
      margin: auto;
      padding: 13px 18px;
      border-radius: 6px;
      background: var(--green);
      color: var(--white);
      box-shadow: 0 12px 38px rgba(0, 0, 0, .22);
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
      transition: opacity .24s ease, transform .24s ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    :focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px;
    }

    @media (max-width: 820px) {
      .site-header { min-height: 70px; padding: 12px 20px; }
      .page-shell {
        width: min(100% - 36px, 620px);
        min-height: calc(100svh - 70px);
        grid-template-columns: 1fr;
        gap: 36px;
        padding: 48px 0 calc(42px + env(safe-area-inset-bottom));
      }
      .profile-preview {
        min-height: 0;
        aspect-ratio: 16 / 7;
      }
      .profile-preview img { object-position: center 12%; }
      .profile-caption { right: 10px; bottom: 10px; left: 10px; }
    }

    @media (max-width: 520px) {
      .brand { font-size: 15px; }
      .back-link span:last-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
      .page-shell { width: calc(100% - 30px); padding-top: 38px; }
      h1 { font-size: 46px; }
      .subtitle { font-size: 16px; }
      .advisor { margin-top: 28px; }
      .wechat-number { grid-template-columns: 1fr; gap: 16px; margin-top: 28px; }
      .wechat-number .button { width: 100%; }
      .message-card { margin-top: 22px; padding: 22px 18px; }
      .message-text { font-size: 17px; }
      .profile-preview { aspect-ratio: 4 / 3; }
      .toast { right: 12px; left: 12px; max-width: calc(100% - 24px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="PARK SILICON 首页">PARK SILICON</a>
    <a class="back-link" href="index.html"><span aria-hidden="true">←</span><span>返回官网</span></a>
  </header>

  <main class="page-shell">
    <section aria-labelledby="page-title">
      <p class="eyebrow">WeChat Enquiry</p>
      <h1 id="page-title">微信咨询</h1>
      <p class="subtitle">添加微信顾问，获取项目资料及最新信息。</p>

      <div class="advisor">
        <div class="advisor-avatar" role="img" aria-label="微信顾问头像"></div>
        <div>
          <p class="advisor-label">项目顾问</p>
          <p class="advisor-name">娜娜</p>
        </div>
      </div>

      <div class="wechat-number">
        <div>
          <span class="field-label">微信号</span>
          <strong class="wechat-id" id="wechat-id">dount-1</strong>
        </div>
        <button class="button" type="button" data-copy-wechat>复制微信号</button>
      </div>

      <section class="message-card" aria-labelledby="message-heading">
        <p id="message-heading">添加好友后，请发送以下内容：</p>
        <p class="message-text" id="consultation-message">您好，我想咨询 ParkSilicon 项目。</p>
        <button class="button button-primary" type="button" data-copy-message>复制咨询内容</button>
      </section>
    </section>

    <aside class="profile-preview" aria-label="微信顾问资料预览">
      <img src="assets/wechat-source.jpg" alt="娜娜的微信资料页">
      <div class="profile-caption">微信号：dount-1</div>
    </aside>
  </main>

  <div class="toast" role="status" aria-live="polite" aria-atomic="true" data-toast></div>

  <script>
    (() => {
      const toast = document.querySelector('[data-toast]');
      let toastTimer;

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('is-visible');
        toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 2800);
      }

      async function copyText(value, successMessage) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(value);
          } else {
            // Fallback keeps copying available in older iOS/Android webviews.
            const textarea = document.createElement('textarea');
            textarea.value = value;
            textarea.setAttribute('readonly', '');
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            textarea.setSelectionRange(0, textarea.value.length);
            const copied = document.execCommand('copy');
            textarea.remove();
            if (!copied) throw new Error('Copy command failed');
          }
          showToast(successMessage);
        } catch (error) {
          showToast('复制失败，请长按文字手动复制。');
        }
      }

      document.querySelector('[data-copy-wechat]').addEventListener('click', () => {
        copyText(document.querySelector('#wechat-id').textContent.trim(), '✓ 微信号已复制');
      });

      document.querySelector('[data-copy-message]').addEventListener('click', () => {
        copyText(document.querySelector('#consultation-message').textContent.trim(), '✓ 咨询内容已复制，请添加好友后直接粘贴发送。');
      });
    })();
  </script>
</body>
</html>
